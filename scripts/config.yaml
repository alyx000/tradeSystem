# ============================================
# 数据采集系统配置
# ============================================

# 数据源配置
providers:
  tushare:
    enabled: true
    token: ""  # 在 .env 中配置，不要直接写在这里
    priority: 1  # 优先级，数字越小越优先
    points_limit: 10000  # 积分上限
    rate_limit: 200  # 每分钟最大请求数

  akshare:
    enabled: true
    priority: 2
    rate_limit: 60
    chinamoney_enabled: true  # 中国货币网 USD/CNY 在岸即期与 C-Swap 定盘
    http_timeout: 15

  eastmoney:
    enabled: true
    priority: 3
    note: "东方财富网页数据，作为补充"

  sina:
    enabled: true
    priority: 3
    note: "新浪实时行情（get_realtime_quotes），免费无 token；频控未做节流，消费方轮询间隔建议 >=3s"

# 数据采集调度
schedule:
  pre_market:
    time: "07:00"
    timezone: "Asia/Shanghai"
    tasks:
      - "global_markets"    # 外盘数据
      - "macro_calendar"    # 今日宏观事件
      - "holdings_announcements"  # 持仓股公告
      - "watchlist_announcements" # 关注池公告
      - "news_search"       # 新闻搜索
      - "generate_pre_report"    # 生成盘前简报

  post_market:
    time: "20:00"
    timezone: "Asia/Shanghai"
    tasks:
      - "market_data"       # 行情数据
      - "limit_data"        # 涨跌停数据
      - "sector_rankings"   # 板块排名
      - "holdings_data"     # 持仓股数据
      - "watchlist_data"    # 关注池数据
      - "northbound"        # 北向资金
      - "dragon_tiger"      # 龙虎榜
      - "post_announcements"# 盘后公告
      - "regulatory_monitor"   # 异动监管（停牌 + 潜在监管）
      - "generate_post_report"   # 生成盘后报告

  evening:
    # 与 post 同在 20:00 窗口内，由 main.py post 先执行本段再跑全日盘后
    time: "20:00"
    timezone: "Asia/Shanghai"
    tasks:
      - "premium_backfill"  # 回填昨日溢价率（T-1涨停→T日开盘溢价）
      - "watchlist_check"   # 关注池行情更新 + 到价提醒
      - "obsidian_export"   # 导出当日数据到 Obsidian

# 推送配置
push:
  # Discord Webhook 推送
  discord:
    enabled: true  # ✅ 已启用
    # Webhook URL 在 .env 中配置：DISCORD_WEBHOOK_PRE, DISCORD_WEBHOOK_POST, DISCORD_WEBHOOK_ALERT
    channels:
      pre_market: "盘前简报"      # 盘前简报频道
      post_market: "盘后报告"     # 盘后报告频道
      alerts: "交易告警"          # 实时告警频道

  # QQ Bot 推送（通过 OpenClaw message 工具）
  qq:
    enabled: true  # ✅ 已启用
    channels:
      pre_market: "user:A542A4E92165E4B6A608072538B5CF04"    # 私聊 (代码中自动转换为 qqbot:c2c:)
      post_market: "user:A542A4E92165E4B6A608072538B5CF04"   # 私聊
      alerts: "user:A542A4E92165E4B6A608072538B5CF04"        # 私聊

  # 企业微信机器人推送
  wechat:
    enabled: false  # 如需启用，改为 true
    # Webhook URL 在 .env 中配置：WECHAT_WEBHOOK

# 存储配置
storage:
  # 每日数据存到 daily/ 目录
  daily_dir: "../daily"
  # Web 页面数据目录
  web_dir: "../web/data"
  # 保留天数
  retention_days: 365

# 持仓配置（已废弃：持仓以 SQLite holdings 表为唯一事实源，请用 db holdings-* / Web）
holdings:
  source: "manual"  # manual / broker_export（保留字段；实际数据在 data/trade.db）
  # file: "../tracking/holdings.yaml"  # 已废弃；迁移请用: python3 main.py db holdings-import-yaml

# 市场配置
market:
  focus: "A股"  # A股 / 港股 / 全部
  trade_calendar: "SSE"  # 上交所交易日历

# macro-flash 宏观快讯筛选词表(主题 → 词表;条目按首个命中主题归组,声明顺序即优先级)
macro_flash:
  keywords:
    货币政策: [央行, 降准, MLF, LPR, 存款利率, 公开市场, 逆回购]
    财政债券: [财政部, 国债, 地方债, 专项债, 赤字, 化债, 投标利率]
    贸易外交: [商务部, 关税, 贸易, 磋商, 反制, 出口管制, 理事会]
    产业监管: [发改委, 证监会, 金融监管总局, 产业政策, 集采, 反垄断]
    # 海外央行含全称:最长匹配下 欧洲央行/日本央行/英国央行 盖过 货币政策 的裸「央行」
    海外宏观: [美联储, 加息, 降息预期, 非农, CPI, PPI, 欧央行, 日央行, 欧洲央行, 日本央行, 英国央行]

# morning-brief 盘前早报要闻词表(主题 → 词表;条目按首个命中主题归组,声明顺序即优先级;
# 未命中但金十标 important 的条目归「其他要闻」兜底)
morning_brief:
  keywords:
    # 海外在前:中美贸易类(同时含 美国/商务部)按声明顺序归海外,符合"隔夜外盘视角"
    # 国家名尽量全:裸「央行/国家统计局」在国内词表,海外机构(秘鲁央行等)靠国家名
    # 在声明序更靠前的海外主题先命中纠偏
    海外要闻: [美股, 美联储, 纳斯达克, 道琼斯, 标普, 纳指, 费城半导体, 英伟达, OpenAI,
             特斯拉, 苹果公司, 台积电, 美国, 日本, 韩国, 欧洲, 欧盟, 英国, 德国, 法国,
             印度, 俄罗斯, 伊朗, 中东, 原油, OPEC, 美债, 非农, 白宫, 美元指数,
             # 不放裸「加息/降息」:会把「央行宣布降息」类国内头条错归海外(门1 finding);
             # 美联储议息类新闻自有 美联储/美国 命中,降息预期沿用 macro_flash 纠偏词
             欧洲央行, 日本央行, 英国央行, 降息预期, 加拿大, 阿根廷, 秘鲁, 巴西,
             墨西哥, 澳洲, 澳大利亚, 新西兰, 瑞士, 瑞典, 土耳其, 印尼, 新加坡, 越南]
    国内要闻: [国务院, 央行, 中国人民银行, 发改委, 证监会, 财政部, 工信部, 商务部,
             金融监管总局, 国资委, 国家统计局, 上交所, 深交所, 北交所, A股, 沪指,
             创业板, 科创板, 两市, 人民币, 乘联会, 中汽协, 国常会]
